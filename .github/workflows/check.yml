name: Build and checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run simulated-hardware checks
        run: zsh scripts/check.sh
      - name: Build app
        run: zsh scripts/build-app.sh
      - name: Verify app bundle
        run: |
          codesign --verify --deep --strict --verbose=1 "dist/Protect Ears.app"
          plutil -lint "dist/Protect Ears.app/Contents/Info.plist"
